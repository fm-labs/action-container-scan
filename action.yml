name: 'Container Scan Action'
description: 'Scans container images for vulnerabilities using custom script'
author: 'fm-labs'

inputs:
  image:
    description: 'A image within the source code repo'
    required: false
    default: '.'

outputs:
  scan-output:
    description: 'Output from the container scan script'
  exit-code:
    description: 'Exit code from the scan script'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.image }}

branding:
  icon: 'shield'
  color: 'blue'