name: Container Scan Example

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run Container Scan
      id: container-scan
      uses: ./
      with:
        image: 'nginx:latest'  # Example image to scan
        
    - name: Display scan results
      run: |
        echo "Container scan completed with exit code: ${{ steps.container-scan.outputs.exit-code }}"
        echo ""
        echo "Scan output:"
        echo "${{ steps.container-scan.outputs.scan-output }}"
        
    - name: Check scan status
      run: |
        if [ "${{ steps.container-scan.outputs.exit-code }}" != "0" ]; then
          echo "Container scan failed!"
          exit 1
        else
          echo "Container scan passed successfully!"
        fi